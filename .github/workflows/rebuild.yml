name: Rebuild modpack

# Builds the pack with pakku and publishes it as a GitHub release. Fires on a
# push to main (e.g. pakku.json/pakku-lock.json or config/scripts changes),
# on manual request, or a schedule can be added later if desired.
#
# Manual runs can optionally bump every project (`pakku update -a`) before
# building, and always publish:
#   - a rolling "pack-latest" prerelease (always overwritten - good for a
#     quick "give me the newest build" link), and
#   - a proper tagged release named after pakku.json's version, when that
#     version doesn't already have a release.

on:
  workflow_dispatch:
    inputs:
      update_all:
        description: "Run `pakku update -a` first (bumps every non-frozen project)"
        type: boolean
        default: false
  push:
    branches: [main]

# A fresh push supersedes any rebuild already running for this pack.
concurrency:
  group: rebuild-modpack
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pakku
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pakku.jar" \
            https://github.com/juraj-hrivnak/Pakku/releases/latest/download/pakku.jar
          printf '#!/usr/bin/env bash\nexec java -jar "%s" "$@"\n' "$RUNNER_TEMP/pakku.jar" | sudo tee /usr/local/bin/pakku >/dev/null
          sudo chmod +x /usr/local/bin/pakku
          pakku --version

      - name: Configure CurseForge credentials
        env:
          CF_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -z "$CF_KEY" ]; then echo "::error::CURSEFORGE_API_KEY secret is not set"; exit 1; fi
          mkdir -p "$HOME/.pakku"
          printf '{"curseforge_api_key":"%s"}' "$CF_KEY" > "$HOME/.pakku/credentials"

      - name: Optional full update
        if: ${{ inputs.update_all == 'true' }}
        run: pakku -y update -a || true

      - name: Fetch mods
        run: pakku -y fetch

      - name: Build exports
        run: pakku -y export

      - name: Commit refreshed lock
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pakku.json pakku-lock.json
          if git diff --cached --quiet; then
            echo "No lock changes to commit."
          else
            git commit -m "ci: refresh pakku lock [skip ci]"
            git push origin main
          fi

      - name: Stage build artifacts with distinct names
        run: |
          # pakku names the curseforge and serverpack zips identically
          # (<name>-<version>.zip), which collides as GitHub release assets.
          # Re-stage each with a role suffix. The pack name (e.g. "NTM: Cleanroom")
          # can contain characters like ':' that upload-artifact/most filesystems
          # reject, so filenames use a sanitized slug; release/artifact titles
          # keep the human-readable name.
          shopt -s nullglob
          name=$(jq -r '.name' pakku.json)
          ver=$(jq -r '.version' pakku.json)
          echo "PACK_NAME=$name" >> "$GITHUB_ENV"
          echo "PACK_VERSION=$ver" >> "$GITHUB_ENV"
          # Filesystem/artifact-safe slug (letters/digits/-/_ only).
          slug=$(echo "$name" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
          echo "PACK_SLUG=$slug" >> "$GITHUB_ENV"
          mkdir -p dist
          for f in build/serverpack/*.zip;  do cp "$f" "dist/${slug}-${ver}-serverpack.zip"; done
          for f in build/curseforge/*.zip;  do cp "$f" "dist/${slug}-${ver}-curseforge.zip"; done
          for f in build/modrinth/*.mrpack; do cp "$f" "dist/${slug}-${ver}.mrpack";          done
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then echo "::error::no build artifacts produced"; exit 1; fi
          ls -la dist

      - name: Publish rolling pack-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete pack-latest --yes --cleanup-tag || true
          gh release create pack-latest dist/* \
            --title "Latest pack build (${GITHUB_SHA::7})" \
            --notes "Automated rebuild triggered by ${{ github.event_name }}." \
            --prerelease

      - name: Publish tagged release for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${PACK_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping (bump the version in pakku.json to cut a new one)."
          else
            gh release create "$tag" dist/* \
              --title "${PACK_NAME} ${PACK_VERSION}" \
              --notes "Built from commit ${GITHUB_SHA::7}."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACK_SLUG }}-pack
          if-no-files-found: error
          path: dist/*
