# Configuration file

alliances {
    # When an alliance is broken, both factions enter a truce during which they cannot siege or harm each other. Length in minutes; 0 disables the truce. [range: 0 ~ 525600, default: 60]
    I:"Alliance Truce Duration [min]"=60

    # Maximum number of simultaneous alliances a faction may hold. Set to -1 for unlimited. [range: -1 ~ 1000, default: 10]
    I:"Max Allies Per Faction"=10
}


citadelfoe {
    # Can players dismount entities Citadels of other Factions [default: false]
    B:"CitadelFoe - Allow Dismount Entity"=false

    # Can mobs enter Citadels of other Factions [default: true]
    B:"CitadelFoe - Allow Mob Entry"=true

    # Can mobs spawn in Citadels of other Factions [default: true]
    B:"CitadelFoe - Allow Mob Spawns"=true

    # Can players mount entities Citadels of other Factions [default: false]
    B:"CitadelFoe - Allow Mount Entity"=false

    # Can blocks be removed at all in (including from explosions, mobs etc) Citadels of other Factions [default: true]
    B:"CitadelFoe - Block Removal"=true

    # Blacklist: block IDs that can never be broken, even if breaking is otherwise allowed [default: ]
    S:"CitadelFoe - Break Blacklist" <
     >

    # Can players break blocks in Citadels of other Factions [default: false]
    B:"CitadelFoe - Break Blocks"=false

    # Whitelist: block IDs that can still be broken. Has no effect if block breaking is allowed anyway [default: [minecraft:torch], [warforge:siegecampblock]]
    S:"CitadelFoe - Break Whitelist" <
        minecraft:torch
        warforge:siegecampblock
     >

    # Can players deal damage in Citadels of other Factions [default: true]
    B:"CitadelFoe - Deal Damage"=true

    # Can explosions damage blocks in Citadels of other Factions [default: false]
    B:"CitadelFoe - Explosion Damage"=false

    # Can players interact with blocks and entities in Citadels of other Factions [default: false]
    B:"CitadelFoe - Interact"=false

    # Blacklist: block IDs that can never be interacted with, even if interaction is otherwise allowed [default: ]
    S:"CitadelFoe - Interact Blacklist" <
     >

    # Whitelist: block IDs that can still be interacted with. Has no effect if interacting is allowed anyway [default: [minecraft:ender_chest], [warforge:citadelblock], [warforge:basicclaimblock], [warforge:reinforcedclaimblock], [warforge:siegecampblock]]
    S:"CitadelFoe - Interact Whitelist" <
        minecraft:ender_chest
        warforge:citadelblock
        warforge:basicclaimblock
        warforge:reinforcedclaimblock
        warforge:siegecampblock
     >

    # Blocks excluded from MineTime in this profile (full protection). Same pattern syntax; no value spec. Whitelist entries win. [default: ]
    S:"CitadelFoe - MineTime Blacklist" <
     >

    # Default slow-down mode: MULTIPLIER (break time = natural time x value) or FIXED (break time = value seconds). [default: MULTIPLIER]
    S:"CitadelFoe - MineTime Default Mode"=MULTIPLIER

    # Default value for the chosen mode: a time multiplier for MULTIPLIER, or a break time in seconds for FIXED. [range: 0.0 ~ 100000.0, default: 5.0]
    S:"CitadelFoe - MineTime Default Value"=5.0

    # If enabled, breaking a block this profile would normally block is slowed down rather than cancelled in Citadels of other Factions. Whitelisted per-block values below still apply even when this is false. [default: false]
    B:"CitadelFoe - MineTime Enabled"=false

    # Blocks that MineTime always slows in this profile (even when disabled above), optionally with a per-entry override. Each entry is a pattern, optionally followed by '=' and a value spec. Patterns: exact id ('gregtech:steam_macerator'), '*' globs ('gregtech:*', 'minecraft:*_ore'). Value specs: 'x10' or '10' = 10x time, '30s' = fixed 30 seconds; omit to use the default mode/value. [default: ]
    S:"CitadelFoe - MineTime Whitelist" <
     >

    # Blacklist: block IDs that can never be placed, even if placement is otherwise allowed [default: ]
    S:"CitadelFoe - Place Blacklist" <
     >

    # Can players place blocks in Citadels of other Factions [default: false]
    B:"CitadelFoe - Place Blocks"=false

    # Whitelist: block IDs that can still be placed. Has no effect if block placement is allowed anyway [default: [minecraft:torch]]
    S:"CitadelFoe - Place Whitelist" <
        minecraft:torch
     >

    # Can players take damage from any other source in Citadels of other Factions [default: true]
    B:"CitadelFoe - Take Any Other Dmg"=true

    # Can players take mob damage in Citadels of other Factions [default: true]
    B:"CitadelFoe - Take Dmg From Mob"=true

    # Can players take damage from other players in Citadels of other Factions [default: true]
    B:"CitadelFoe - Take Dmg From Player"=true

    # Blacklist: item IDs that can never be used, even if using items is otherwise allowed [default: ]
    S:"CitadelFoe - Use Blacklist" <
     >

    # Can players use items in Citadels of other Factions [default: false]
    B:"CitadelFoe - Use Items"=false

    # Whitelist: item IDs that can still be used. Has no effect if using items is allowed anyway [default: [minecraft:snowball]]
