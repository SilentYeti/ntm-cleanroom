    B:"SiegeOther - Allow Dismount Entity"=true

    # Can mobs enter Other sieges, defending or neutral [default: true]
    B:"SiegeOther - Allow Mob Entry"=true

    # Can mobs spawn in Other sieges, defending or neutral [default: true]
    B:"SiegeOther - Allow Mob Spawns"=true

    # Can players mount entities Other sieges, defending or neutral [default: true]
    B:"SiegeOther - Allow Mount Entity"=true

    # Can blocks be removed at all in (including from explosions, mobs etc) Other sieges, defending or neutral [default: true]
    B:"SiegeOther - Block Removal"=true

    # Blacklist: block IDs that can never be broken, even if breaking is otherwise allowed [default: ]
    S:"SiegeOther - Break Blacklist" <
     >

    # Can players break blocks in Other sieges, defending or neutral [default: true]
    B:"SiegeOther - Break Blocks"=true

    # Whitelist: block IDs that can still be broken. Has no effect if block breaking is allowed anyway [default: [minecraft:torch], [warforge:siegecampblock]]
    S:"SiegeOther - Break Whitelist" <
        minecraft:torch
        warforge:siegecampblock
     >

    # Can players deal damage in Other sieges, defending or neutral [default: true]
    B:"SiegeOther - Deal Damage"=true

    # Can explosions damage blocks in Other sieges, defending or neutral [default: false]
    B:"SiegeOther - Explosion Damage"=false

    # Can players interact with blocks and entities in Other sieges, defending or neutral [default: true]
    B:"SiegeOther - Interact"=true

    # Blacklist: block IDs that can never be interacted with, even if interaction is otherwise allowed [default: ]
    S:"SiegeOther - Interact Blacklist" <
     >

    # Whitelist: block IDs that can still be interacted with. Has no effect if interacting is allowed anyway [default: [minecraft:ender_chest], [warforge:citadelblock], [warforge:basicclaimblock], [warforge:reinforcedclaimblock], [warforge:siegecampblock]]
    S:"SiegeOther - Interact Whitelist" <
        minecraft:ender_chest
        warforge:citadelblock
        warforge:basicclaimblock
        warforge:reinforcedclaimblock
        warforge:siegecampblock
     >

    # Blocks excluded from MineTime in this profile (full protection). Same pattern syntax; no value spec. Whitelist entries win. [default: ]
    S:"SiegeOther - MineTime Blacklist" <
     >

    # Default slow-down mode: MULTIPLIER (break time = natural time x value) or FIXED (break time = value seconds). [default: MULTIPLIER]
    S:"SiegeOther - MineTime Default Mode"=MULTIPLIER

    # Default value for the chosen mode: a time multiplier for MULTIPLIER, or a break time in seconds for FIXED. [range: 0.0 ~ 100000.0, default: 5.0]
    S:"SiegeOther - MineTime Default Value"=5.0

    # If enabled, breaking a block this profile would normally block is slowed down rather than cancelled in Other sieges, defending or neutral. Whitelisted per-block values below still apply even when this is false. [default: false]
    B:"SiegeOther - MineTime Enabled"=false

    # Blocks that MineTime always slows in this profile (even when disabled above), optionally with a per-entry override. Each entry is a pattern, optionally followed by '=' and a value spec. Patterns: exact id ('gregtech:steam_macerator'), '*' globs ('gregtech:*', 'minecraft:*_ore'). Value specs: 'x10' or '10' = 10x time, '30s' = fixed 30 seconds; omit to use the default mode/value. [default: ]
    S:"SiegeOther - MineTime Whitelist" <
     >

    # Blacklist: block IDs that can never be placed, even if placement is otherwise allowed [default: ]
    S:"SiegeOther - Place Blacklist" <
     >

    # Can players place blocks in Other sieges, defending or neutral [default: true]
    B:"SiegeOther - Place Blocks"=true

    # Whitelist: block IDs that can still be placed. Has no effect if block placement is allowed anyway [default: [minecraft:torch]]
    S:"SiegeOther - Place Whitelist" <
        minecraft:torch
     >

    # Can players take damage from any other source in Other sieges, defending or neutral [default: true]
    B:"SiegeOther - Take Any Other Dmg"=true

    # Can players take mob damage in Other sieges, defending or neutral [default: true]
    B:"SiegeOther - Take Dmg From Mob"=true

    # Can players take damage from other players in Other sieges, defending or neutral [default: true]
    B:"SiegeOther - Take Dmg From Player"=true

    # Blacklist: item IDs that can never be used, even if using items is otherwise allowed [default: ]
    S:"SiegeOther - Use Blacklist" <
     >

    # Can players use items in Other sieges, defending or neutral [default: true]
    B:"SiegeOther - Use Items"=true

    # Whitelist: item IDs that can still be used. Has no effect if using items is allowed anyway [default: [minecraft:snowball]]
    S:"SiegeOther - Use Whitelist" <
        minecraft:snowball
     >
}


