# Configuration file

client {
    # Select the backend to use. Set to "DEFAULT" to let Flywheel decide. [default: DEFAULT]
    S:backend=DEFAULT

    # Whether bakes apply AO to dim light-emitters (fixes MC-225516). AUTO matches the surrounding terrain — enabled iff Alfheim/Hesperus/Phosphor is installed. ON forces the fix; OFF keeps strict vanilla behavior. [default: AUTO]
    S:emissiveBlockAoBakingFix=AUTO

    # Enable or disable instance update limiting with distance. [default: true]
    B:limitUpdates=true

    # If true, use the JVM-wide ForkJoinPool.commonPool() instead of a dedicated Flywheel pool. Saves threads but other code submitting to the common pool (incl. misbehaving mods) can stall Flywheel sync points. Requires a game restart to take effect. [default: false]
    B:useCommonPool=false

    # Number of worker threads for the Flywheel ForkJoinPool. Positive: absolute count, clamped to availableProcessors. Zero or negative: relative to availableProcessors (0 = all cores, -1 = leaves one for the render thread, -N = leaves N). Result is always at least 1; a result of 1 routes to the serial executor. Requires a game restart to take effect. [range: -12 ~ 12, default: -1]
    I:workerThreads=-1

    flw_backends {
        # How smooth Flywheel's shader-based lighting should be. May have a large performance impact. [default: SMOOTH]
        S:lightSmoothness=SMOOTH
    }

    options_uniforms {
        # Values forwarded to the OptionsUniforms UBO for downstream shader use. CrankShaft itself only consumes glintSpeed (foil item shimmer); the rest are passthrough knobs for shaders that read 1.20+-era option uniforms. 1.0 = vanilla damage-tilt strength. [range: 0.0 ~ 1.0, default: 1.0]
        S:damageTilt=1.0

        # Values forwarded to the OptionsUniforms UBO for downstream shader use. CrankShaft itself only consumes glintSpeed (foil item shimmer); the rest are passthrough knobs for shaders that read 1.20+-era option uniforms. 1.0 = full sculk darkness-effect pulse. [range: 0.0 ~ 1.0, default: 1.0]
        S:darknessPulsing=1.0

        # Values forwarded to the OptionsUniforms UBO for downstream shader use. CrankShaft itself only consumes glintSpeed (foil item shimmer); the rest are passthrough knobs for shaders that read 1.20+-era option uniforms. 1.0 = full screen-effect distortion (portal/pumpkin/nausea overlays). [range: 0.0 ~ 1.0, default: 1.0]
        S:distortion=1.0

        # Values forwarded to the OptionsUniforms UBO for downstream shader use. CrankShaft itself only consumes glintSpeed (foil item shimmer); the rest are passthrough knobs for shaders that read 1.20+-era option uniforms. 1.0 = vanilla enchantment foil scroll speed; 0.0 = static. [range: 0.0 ~ 1.0, default: 1.0]
        S:glintSpeed=1.0

        # Values forwarded to the OptionsUniforms UBO for downstream shader use. CrankShaft itself only consumes glintSpeed (foil item shimmer); the rest are passthrough knobs for shaders that read 1.20+-era option uniforms. 1.0 = vanilla enchantment foil alpha. [range: 0.0 ~ 1.0, default: 1.0]
        S:glintStrength=1.0

        # Values forwarded to the OptionsUniforms UBO for downstream shader use. CrankShaft itself only consumes glintSpeed (foil item shimmer); the rest are passthrough knobs for shaders that read 1.20+-era option uniforms. Accessibility flag for shaders that suppress lightning flashes. [default: false]
        B:hideLightningFlashes=false

        # Values forwarded to the OptionsUniforms UBO for downstream shader use. CrankShaft itself only consumes glintSpeed (foil item shimmer); the rest are passthrough knobs for shaders that read 1.20+-era option uniforms. High-contrast UI flag. [default: false]
        B:highContrast=false

        # Values forwarded to the OptionsUniforms UBO for downstream shader use. CrankShaft itself only consumes glintSpeed (foil item shimmer); the rest are passthrough knobs for shaders that read 1.20+-era option uniforms. If true, only chat shows a text background. [default: false]
        B:textBackgroundForChatOnly=false

        # Values forwarded to the OptionsUniforms UBO for downstream shader use. CrankShaft itself only consumes glintSpeed (foil item shimmer); the rest are passthrough knobs for shaders that read 1.20+-era option uniforms. 0.5 mirrors vanilla 1.12.2's hard-coded chat-hover alpha. [range: 0.0 ~ 1.0, default: 0.5]
        S:textBackgroundOpacity=0.5
    }

}


